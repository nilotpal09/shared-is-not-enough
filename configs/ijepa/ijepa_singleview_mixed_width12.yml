# ijepa_singleview_mixed_width12: run with  python train.py --config configs/ijepa/ijepa_singleview_mixed_width12.yml --seed <k>
# paper seeds: 1, 2, 3, 4, 5, 6
data:
  batch_size: 128
  calo_cfg:
    N_cells_x: 64
    N_cells_y: 64
    N_cells_z: 4
    N_spots_per_layer: 1000
    N_spots_range: [100, 10000]
    Z: 82
    cell_e_threshold: 0.0
    depth: 20.0
    height: 10.0
    width: 10.0
  generator_cfg:
    E_range: [100000.0, 500000.0]
    N_range: [5, 20]
    frag_dirichlet_alpha: 5.0
    jet_sigma_face_cm: 0.7
    kind: jet
    pad_value: .nan
    x_range: [-3.0, 3.0]
    y_range: [-3.0, 3.0]
  norm:
    mode: log1p_scale
    scale: 5500.0
  num_events: 64000
  num_workers: 0
  persistent_workers: true
  pin_mem: true
  sample_target: false
logging:
  write_tag: jepa
mask:
  allow_overlap: false
  aspect_ratio: [0.75, 1.5]
  enc_mask_scale: [0.85, 1.0]
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 4
  pred_mask_scale: [0.15, 0.2]
meta:
  checkpoint_schedule:
  - [50, 2]
  - [500, 25]
  copy_data: false
  load_checkpoint: false
  model_name: vit_nano
  objective: ijepa
  pred_depth: 3
  pred_emb_dim: 12
  read_checkpoint: null
  use_bfloat16: true
optimization:
  ema: [0.996, 1.0]
  epochs: 500
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  warmup: 40
  weight_decay: 0.04
