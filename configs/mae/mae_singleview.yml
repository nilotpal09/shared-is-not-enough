# mae_singleview: run with  python train.py --config configs/mae/mae_singleview.yml --seed <k>
# paper seeds: 1, 3, 4, 5, 6, 7
data:
  batch_size: 128
  calo_cfg:
    N_cells_x: 64
    N_cells_y: 64
    N_cells_z: 4
    N_spots_per_layer: 1000
    Z: 82
    cell_e_threshold: 0.0
    depth: 20.0
    height: 10.0
    width: 10.0
  generator_cfg:
    E_range: [100000.0, 500000.0]
    N_range: [5, 20]
    frag_dirichlet_alpha: 5.0
    jet_sigma_face_cm: 0.7
    kind: jet
    pad_value: .nan
    x_range: [-3.0, 3.0]
    y_range: [-3.0, 3.0]
  norm:
    mode: log1p_scale
    scale: 5500.0
  num_events: 64000
  num_workers: 0
  persistent_workers: true
  pin_mem: true
logging:
  write_tag: mae
mask:
  mask_ratio: 0.75
  patch_size: 4
meta:
  decoder_depth: 4
  decoder_embed_dim: 48
  decoder_num_heads: 3
  load_checkpoint: false
  model_name: vit_nano
  normalize_pixels: true
  objective: mae
  read_checkpoint: null
  use_bfloat16: true
optimization:
  epochs: 500
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  warmup: 40
  weight_decay: 0.04
